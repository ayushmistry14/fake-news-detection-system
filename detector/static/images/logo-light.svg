<svg width="160" height="50" viewBox="0 0 160 50" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 'F' Background Box -->
    <rect x="0" y="0" width="44" height="44" rx="14" fill="#0d9488"/>
    <!-- 'F' Letter (White) -->
    <text x="22" y="32" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="white" text-anchor="middle">F</text>
    <!-- "Fake News" Text (WHITE for dark background) -->
    <text x="54" y="22" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="white">Fake News</text>
    <!-- "DETECTOR" Text (Light Purple for dark background) -->
    <text x="54" y="38" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#c4b5fd" letter-spacing="1">DETECTOR</text>
</svg>